name: Apply vehicle-contact streamline filter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'Apply vehicle-contact streamline filter') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply streamline filter
        run: python3 tools/apply_streamline_filter.py

      - name: Commit patched kernel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FluidX3D-master/src/kernel.cpp tools/apply_streamline_filter.py .github/workflows/apply-streamline-filter.yml
          if git diff --cached --quiet; then
            echo "No source changes were necessary."
            exit 0
          fi
          git commit -m "Apply vehicle-contact streamline filter"
          git push origin HEAD:main
